<text x="40" y="48" font-size="26" fill="#f8fafc" text-anchor="start" font-weight="700">05  独立制动检查：检查整个车体未来扫过的区域</text>
<text x="40" y="80" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">输入：当前障碍点、候选 (v, ω)、实测 (v, ω)、里程计年龄 · 零候选也保留当前动量</text>
<text x="190.0" y="153" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">① 延迟段</text>
<text x="190.0" y="177" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">保持实测速度</text>
<text x="190.0" y="199" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">0.20 s 反应时间 + state_age</text>
<text x="560.0" y="153" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">② 速度过渡段</text>
<text x="560.0" y="177" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">实测速度 → 候选速度</text>
<text x="560.0" y="199" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">按 0.5 m/s²、0.8 rad/s² 约束</text>
<text x="930.0" y="153" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">③ 制动到静止</text>
<text x="930.0" y="177" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">候选线 / 角速度按比例归零</text>
<text x="930.0" y="199" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">时长 max(|v|/0.5, |ω|/0.8)</text>
<text x="40" y="278" font-size="17" fill="#e2e8f0" text-anchor="start" font-weight="400">以 0.02 s 步长积分位姿，在每个预测位姿上计算障碍点到整车矩形的距离。</text>
<text x="58" y="337" font-size="16" fill="#fbbf24" text-anchor="start" font-weight="600">矩形轮廓扫掠 · 示意候选在转弯时靠近障碍</text>
<text x="723" y="337" font-size="16" fill="#fbbf24" text-anchor="start" font-weight="600">候选筛选 · 顺序试探</text>
<text x="561" y="380" font-size="15" fill="#fb7185" text-anchor="middle" font-weight="400">障碍点</text>
<text x="78" y="656" font-size="14" fill="#e2e8f0" text-anchor="start" font-weight="400">圆角外扩 = 4 cm 基础裕量 + 延迟不确定性 + 采样填充</text>
<text x="759" y="387" font-size="19" fill="#fb7185" text-anchor="start" font-weight="600">1.0 × (v, ω)</text>
<text x="759" y="411" font-size="14" fill="#94a3b8" text-anchor="start" font-weight="400">未通过（示例）</text>
<text x="759" y="447" font-size="19" fill="#fb7185" text-anchor="start" font-weight="600">0.8 × (v, ω)</text>
<text x="759" y="471" font-size="14" fill="#94a3b8" text-anchor="start" font-weight="400">未通过（示例）</text>
<text x="759" y="507" font-size="19" fill="#34d399" text-anchor="start" font-weight="600">0.6 × (v, ω)</text>
<text x="759" y="531" font-size="14" fill="#94a3b8" text-anchor="start" font-weight="400">首次通过即采用（示例）</text>
<text x="738" y="586" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="400">剩余尺度：0.4 → 0.2 → 0.0</text>
<text x="738" y="624" font-size="17" fill="#fb7185" text-anchor="start" font-weight="400">全部不通过：输出零</text>
<text x="738" y="652" font-size="14" fill="#fb7185" text-anchor="start" font-weight="400">reason = emergency_stop</text>
<text x="560.0" y="778" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">点到矩形的径向距离，而非点到轮迹线</text>
<text x="560.0" y="802" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">dx = max(−0.25 − x, x − 0.97, 0)     dy = max(|y| − 0.40, 0)</text>
<text x="560.0" y="824" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">clearance = √(dx² + dy²)     若任一时刻 clearance ≤ 检查裕量，则拒绝候选</text>
<text x="40" y="885" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="400">缩放的是候选指令，实测速度不缩放；紧急输出零不等于物理车体瞬间停止。</text></svg>