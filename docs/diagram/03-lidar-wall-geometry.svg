<text x="40" y="48" font-size="26" fill="#f8fafc" text-anchor="start" font-weight="700">03  感知与沿墙几何：所有判断统一到后轴中心</text>
<text x="40" y="80" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">左：车体坐标与双雷达安装位置；右：平行沿墙时的目标净距 · 示意图不表示完整雷达视场</text>
<text x="58" y="147" font-size="16" fill="#fbbf24" text-anchor="start" font-weight="600">后轴坐标与整车轮廓</text>
<text x="593" y="147" font-size="16" fill="#fbbf24" text-anchor="start" font-weight="600">沿墙参考与距离的区别</text>
<text x="463" y="394" font-size="15" fill="#22d3ee" text-anchor="end" font-weight="400">+x 前</text>
<text x="165" y="236" font-size="15" fill="#22d3ee" text-anchor="start" font-weight="400">+y 左</text>
<text x="73" y="543" font-size="17" fill="#e2e8f0" text-anchor="start" font-weight="400">x = [-0.25, 0.97] m</text>
<text x="73" y="569" font-size="17" fill="#e2e8f0" text-anchor="start" font-weight="400">y = [-0.40, 0.40] m</text>
<text x="168" y="435" font-size="15" fill="#22d3ee" text-anchor="start" font-weight="400">后轴 (0,0)</text>
<text x="315" y="285" font-size="14" fill="#fb923c" text-anchor="middle" font-weight="400">左雷达 (0.79, +0.26)</text>
<text x="315" y="518" font-size="14" fill="#fb923c" text-anchor="middle" font-weight="400">右雷达 (0.79, −0.26)</text>
<text x="1015" y="202" font-size="16" fill="#fbbf24" text-anchor="end" font-weight="400">墙线  n·p = d</text>
<text x="1018" y="442" font-size="16" fill="#34d399" text-anchor="end" font-weight="400">墙切向参考 t →</text>
<text x="625" y="281" font-size="14" fill="#e2e8f0" text-anchor="end" font-weight="400">0.52 m</text>
<text x="1018" y="296" font-size="16" fill="#fb7185" text-anchor="middle" font-weight="400">0.12 m</text>
<text x="610" y="485" font-size="16" fill="#e2e8f0" text-anchor="start" font-weight="400">后轴距墙 = 半车宽 + 车身边沿净距</text>
<text x="610" y="517" font-size="20" fill="#34d399" text-anchor="start" font-weight="600">0.52 m = 0.40 m + 0.12 m</text>
<text x="610" y="558" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">斜向接近时用切向连续曲线接入参考线。</text>
<text x="147.5" y="688" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">采集时刻 TF</text>
<text x="147.5" y="712" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">scan → odom</text>
<text x="422.5" y="688" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">去除自回波</text>
<text x="422.5" y="712" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">使用采集时车体轮廓</text>
<text x="697.5" y="688" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">分段 SVD 拟合</text>
<text x="697.5" y="712" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">墙线 / 短门框片段</text>
<text x="972.5" y="688" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">意图选边与参考</text>
<text x="972.5" y="712" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">保持侧别 · Hermite 曲线</text>
<text x="40" y="625" font-size="16" fill="#e2e8f0" text-anchor="start" font-weight="600">扫描点处理链（协调器 / 制动检查所用点集）</text>
<text x="40" y="794" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="400">跟踪器 接收的是校验并重标 frame_id 的扫描副本，不复用协调器去自回波后的点集。</text></svg>