<text x="40" y="48" font-size="26" fill="#f8fafc" text-anchor="start" font-weight="700">04  窄门通过：后轴过门后逐步交还转向</text>
<text x="40" y="80" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">门洞先经多帧确认与前进路径搜索 · 门平面进度以实时后轴位置计算 · 几何示意，非实测轨迹</text>
<text x="200.0" y="148" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">door_align</text>
<text x="200.0" y="172" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">沿可行路径对正</text>
<text x="560.0" y="148" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">door_pass</text>
<text x="560.0" y="172" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">车头通过，后轴接近门平面</text>
<text x="920.0" y="148" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">door_clear</text>
<text x="920.0" y="172" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">后轴已过平面，车尾尚未清空</text>
<text x="380" y="215" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">净空 &gt; 0</text>
<text x="740" y="215" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="400">进度 &gt; 0</text>
<text x="280" y="493" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="400">门平面</text>
<text x="640" y="493" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="400">门平面</text>
<text x="900" y="493" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="400">门平面</text>
<text x="200" y="532" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="400">entry_clearance &gt; 0 才进入 pass</text>
<text x="560" y="532" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="400">progress = −center · normal</text>
<text x="920" y="532" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="400">progress &gt; 0.29 m 后解除锁定</text>
<text x="40" y="574" font-size="16" fill="#34d399" text-anchor="start" font-weight="400">门洞限速：对正 0.35 m/s；通过与车尾清空 0.55 m/s。任一阶段都保留整车制动检查。</text>
<text x="58" y="637" font-size="16" fill="#fbbf24" text-anchor="start" font-weight="600">转向交还比例 α</text>
<text x="80" y="680" font-size="13" fill="#94a3b8" text-anchor="end" font-weight="400">1</text>
<text x="80" y="788" font-size="13" fill="#94a3b8" text-anchor="end" font-weight="400">0</text>
<text x="95" y="808" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="400">0</text>
<text x="360" y="808" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="400">0.29 m</text>
<text x="480" y="808" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="400">progress</text>
<text x="832.5" y="638" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">路径角速度与用户转向线性混合</text>
<text x="832.5" y="662" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">α = clip(progress / 0.29, 0, 1)</text>
<text x="832.5" y="684" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">ω = (1 − α) × ω_path + α × ω_raw</text>
<text x="832.5" y="706" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">20 Hz 控制按实时进度交还，不等待阶段标签刷新</text>
<text x="585" y="794" font-size="14" fill="#fb7185" text-anchor="start" font-weight="400">松杆 / 倒车立即取消；明显持续转离 0.35 s 可取消。</text>
<text x="585" y="820" font-size="14" fill="#94a3b8" text-anchor="start" font-weight="400">0.29 m = 后轴后方尾长 0.25 m + 裕量 0.04 m。</text></svg>