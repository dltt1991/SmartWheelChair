<text x="40" y="48" font-size="26" fill="#f8fafc" text-anchor="start" font-weight="700">02  最终指令流程：先检查入口，再选择速度来源</text>
<text x="40" y="80" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">对应 control() 的主要分支 · mode 由 5 Hz 参考更新决定 · 此图不展开各几何模式的内部状态</text>
<text x="157.5" y="138" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">20 Hz 控制周期</text>
<text x="460" y="145" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="600">已回中且指令有效？</text>
<text x="945.0" y="138" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">本周期输出零</text>
<text x="945.0" y="162" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">模式切换 / 输入失效</text>
<text x="607" y="128" font-size="14" fill="#fb7185" text-anchor="start" font-weight="400">否</text>
<text x="477" y="211" font-size="14" fill="#60a5fa" text-anchor="start" font-weight="400">是</text>
<text x="460" y="285" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="600">辅助开启？</text>
<text x="945.0" y="273" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">手动直接发布</text>
<text x="945.0" y="297" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">/cmd_vel = /cmd_vel_raw</text>
<text x="945.0" y="319" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">跳过辅助限幅、平滑与制动</text>
<text x="607" y="268" font-size="14" fill="#22d3ee" text-anchor="start" font-weight="400">否</text>
<text x="477" y="351" font-size="14" fill="#60a5fa" text-anchor="start" font-weight="400">是</text>
<text x="460" y="425" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="600">传感有效且未松杆？</text>
<text x="945.0" y="413" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">本周期输出零</text>
<text x="945.0" y="437" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">stale_input / user_stop</text>
<text x="607" y="408" font-size="14" fill="#fb7185" text-anchor="start" font-weight="400">否</text>
<text x="477" y="491" font-size="14" fill="#60a5fa" text-anchor="start" font-weight="400">是</text>
<text x="460" y="565" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="600">使用直接候选？</text>
<text x="157.5" y="553" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">用户输入 / 横墙限速</text>
<text x="157.5" y="577" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">倒车 / 原地 / override</text>
<text x="157.5" y="599" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">或 front_stop 横墙限速</text>
<text x="306" y="548" font-size="14" fill="#34d399" text-anchor="start" font-weight="400">是</text>
<text x="477" y="631" font-size="14" fill="#60a5fa" text-anchor="start" font-weight="400">否</text>
<text x="460" y="705" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="600">处于可行门洞跟踪？</text>
<text x="945.0" y="693" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">门洞专用跟踪</text>
<text x="945.0" y="717" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">曲率反馈 + 七轮安全速度试探</text>
<text x="945.0" y="739" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">MPPI 超时仍可走此分支</text>
<text x="607" y="688" font-size="14" fill="#a78bfa" text-anchor="start" font-weight="400">是</text>
<text x="477" y="771" font-size="14" fill="#60a5fa" text-anchor="start" font-weight="400">否</text>
<text x="460" y="845" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="600">MPPI 输出新鲜？</text>
<text x="945.0" y="833" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">本周期输出零</text>
<text x="945.0" y="857" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">planner_timeout</text>
<text x="607" y="828" font-size="14" fill="#fb7185" text-anchor="start" font-weight="400">否</text>
<text x="477" y="914" font-size="14" fill="#60a5fa" text-anchor="start" font-weight="400">是</text>
<text x="460.0" y="973" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">MPPI 候选速度</text>
<text x="460.0" y="997" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">叠加沿墙 / 开口转向修正</text>
<text x="460.0" y="1128" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">辅助限幅与速度平滑</text>
<text x="460.0" y="1152" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">门洞分支按平滑后的 v 重算 ω</text>
<text x="460.0" y="1243" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">独立制动检查</text>
<text x="460.0" y="1267" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">1.0 → 0.8 → 0.6 → 0.4 → 0.2 → 0</text>
<text x="460.0" y="1358" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="600">发布 /cmd_vel 与 status</text>
<text x="690" y="1150" font-size="16" fill="#fb7185" text-anchor="start" font-weight="400">全部候选不通过 → 输出零</text>
<text x="690" y="1180" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="400">每次检查都保留实测动量</text></svg>