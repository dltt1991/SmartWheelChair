<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">激光雷达和安全过滤示意图</title>
  <desc id="desc">轮椅俯视图，展示左右激光雷达有效视场、车身过滤边界、慢行距离、停车距离和安全过滤器输出。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .body { fill: #e2e8f0; stroke: #334155; stroke-width: 2; }
      .wheel { fill: #111827; }
      .lidar { fill: #06b6d4; stroke: #0891b2; stroke-width: 2; }
      .scan { fill: #bae6fd; fill-opacity: .34; stroke: #0284c7; stroke-width: 2; stroke-dasharray: 8 6; }
      .slow { fill: none; stroke: #f59e0b; stroke-width: 3; stroke-dasharray: 10 8; }
      .stop { fill: none; stroke: #e11d48; stroke-width: 3; stroke-dasharray: 6 5; }
      .filter { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="980" height="560" fill="#ffffff"/>
  <text x="32" y="44" class="title">激光雷达和安全过滤：先扣掉车身，再按净距离限速</text>

  <g transform="translate(34 82)">
    <rect x="0" y="0" width="600" height="424" rx="8" class="panel"/>
    <text x="24" y="34" class="label">俯视有效感知区域</text>
    <text x="300" y="54" class="small" text-anchor="middle">前方</text>

    <path d="M 254 146 L 380.4 39.9 L 360.1 19.6 L 336.5 3.1 L 310.4 -9 L 282.7 -16.5 L 254 -19 L 225.3 -16.5 L 197.6 -9 L 171.5 3.1 L 147.9 19.6 L 127.6 39.9 L 111.1 63.5 L 99 89.6 L 91.5 117.3 L 89 146 L 91.5 174.7 L 99 202.4 L 111.1 228.5 L 127.6 252.1 L 147.9 272.4 L 171.5 288.9 Z" class="scan"/>
    <path d="M 346 146 L 428.5 288.9 L 452.1 272.4 L 472.4 252.1 L 488.9 228.5 L 501 202.4 L 508.5 174.7 L 511 146 L 508.5 117.3 L 501 89.6 L 488.9 63.5 L 472.4 39.9 L 452.1 19.6 L 428.5 3.1 L 402.4 -9 L 374.7 -16.5 L 346 -19 L 317.3 -16.5 L 289.6 -9 L 263.5 3.1 L 239.9 19.6 L 219.6 39.9 Z" class="scan"/>
    <rect x="96" y="70" width="176" height="30" rx="4" fill="#f8fafc"/>
    <rect x="354" y="70" width="176" height="30" rx="4" fill="#f8fafc"/>
    <text x="105" y="91" class="small">左雷达视场约 200 度</text>
    <text x="366" y="91" class="small">右雷达视场约 200 度</text>

    <rect x="208" y="96" width="184" height="230" rx="28" class="body"/>
    <rect x="168" y="238" width="48" height="92" rx="16" class="wheel"/>
    <rect x="384" y="238" width="48" height="92" rx="16" class="wheel"/>
    <circle cx="242" cy="144" r="21" fill="#64748b"/>
    <circle cx="358" cy="144" r="21" fill="#64748b"/>
    <text x="300" y="116" class="tiny" text-anchor="middle">前万向轮</text>
    <text x="300" y="352" class="tiny" text-anchor="middle">后差速驱动轮</text>

    <rect x="198" y="86" width="204" height="250" rx="34" class="filter"/>
    <text x="300" y="374" class="tiny" text-anchor="middle">车身过滤边界：body_* + 0.02 m</text>

    <circle cx="254" cy="146" r="9" class="lidar"/>
    <circle cx="346" cy="146" r="9" class="lidar"/>
    <rect x="214" y="174" width="78" height="24" rx="4" fill="#f8fafc"/>
    <rect x="328" y="174" width="84" height="24" rx="4" fill="#f8fafc"/>
    <text x="253" y="190" class="tiny" text-anchor="middle">left lidar</text>
    <text x="370" y="190" class="tiny" text-anchor="middle">right lidar</text>

    <path d="M 300 211 m -108 0 a 108 108 0 1 0 216 0 a 108 108 0 1 0 -216 0" class="stop"/>
    <path d="M 300 211 m -212 0 a 212 212 0 1 0 424 0 a 212 212 0 1 0 -424 0" class="slow"/>
    <text x="430" y="282" class="small" fill="#e11d48">stop_distance_m = 0.10 m</text>
    <text x="404" y="402" class="small" fill="#d97706">slow_distance_m = 0.90 m</text>

    <circle cx="498" cy="188" r="14" fill="#e11d48"/>
    <text x="518" y="193" class="small">障碍物</text>
    <line x1="402" y1="188" x2="484" y2="188" stroke="#e11d48" stroke-width="3" marker-end="url(#arrow-rose)"/>
    <text x="430" y="177" class="tiny">净距离</text>
  </g>

  <g transform="translate(668 82)">
    <rect x="0" y="0" width="278" height="424" rx="8" class="panel"/>
    <text x="24" y="34" class="label">过滤流程</text>

    <rect x="34" y="70" width="210" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="139" y="94" class="label" text-anchor="middle">LaserScan</text>
    <text x="139" y="114" class="tiny" text-anchor="middle">/scan_left + /scan_right</text>

    <line x1="139" y1="128" x2="139" y2="172" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <rect x="34" y="172" width="210" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="139" y="198" class="label" text-anchor="middle">过滤自身回波</text>
    <text x="139" y="220" class="tiny" text-anchor="middle">计算障碍物到外轮廓净距离</text>

    <line x1="139" y1="244" x2="139" y2="288" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>

    <rect x="34" y="288" width="210" height="72" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="139" y="314" class="label" text-anchor="middle">分区限速</text>
    <text x="139" y="336" class="tiny" text-anchor="middle">前进 / 后退 / 左转 / 右转</text>

    <line x1="139" y1="360" x2="139" y2="392" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-rose)"/>
    <text x="139" y="414" class="small" text-anchor="middle">输出安全后的 /cmd_vel</text>
  </g>
</svg>
