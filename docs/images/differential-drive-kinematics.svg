<svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">差速轮运动学方程示意图</title>
  <desc id="desc">轮椅后轮差速底盘俯视图，标注驱动轮距、车轮半径、左右轮线速度、车体线速度、角速度和核心方程。</desc>
  <defs>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 13px; fill: #475569; }
      .formula { font-family: "SFMono-Regular", Consolas, monospace; font-size: 16px; fill: #0f172a; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .body { fill: #e2e8f0; stroke: #334155; stroke-width: 2; }
      .wheel { fill: #111827; stroke: #0f172a; stroke-width: 2; }
      .caster { fill: #64748b; stroke: #334155; stroke-width: 1.5; }
      .axis { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; }
      .dim { stroke: #475569; stroke-width: 2; marker-start: url(#arrow-slate); marker-end: url(#arrow-slate); }
    </style>
  </defs>

  <rect width="920" height="520" fill="#ffffff"/>
  <text x="32" y="44" class="title">差速轮运动学：左右轮速度决定车体平移和转向</text>

  <g transform="translate(40 82)">
    <rect x="0" y="0" width="500" height="390" rx="8" class="panel"/>
    <text x="24" y="34" class="label">俯视底盘</text>
    <text x="250" y="58" class="small" text-anchor="middle">前方</text>

    <line x1="250" y1="62" x2="250" y2="348" class="axis"/>
    <text x="268" y="112" class="small">车体中心线</text>

    <rect x="165" y="82" width="170" height="230" rx="28" class="body"/>
    <rect x="122" y="206" width="52" height="112" rx="18" class="wheel"/>
    <rect x="326" y="206" width="52" height="112" rx="18" class="wheel"/>
    <circle cx="184" cy="122" r="24" class="caster"/>
    <circle cx="316" cy="122" r="24" class="caster"/>
    <text x="106" y="334" class="small">后差速驱动轮</text>
    <text x="320" y="94" class="small">前万向轮</text>

    <line x1="148" y1="262" x2="352" y2="262" class="dim"/>
    <text x="250" y="248" class="label" text-anchor="middle">L = 0.72 m</text>

    <line x1="148" y1="262" x2="148" y2="154" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow-cyan)"/>
    <line x1="352" y1="262" x2="352" y2="132" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <text x="104" y="150" class="label" fill="#0891b2">v_l</text>
    <text x="372" y="132" class="label" fill="#ea580c">v_r</text>

    <line x1="250" y1="262" x2="250" y2="92" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
    <text x="264" y="96" class="label" fill="#059669">v</text>

    <path d="M 278 194 A 70 70 0 0 1 338 235" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-slate)"/>
    <text x="320" y="186" class="label" fill="#7c3aed" text-anchor="middle">omega</text>

    <circle cx="148" cy="262" r="34" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="148" y1="262" x2="182" y2="262" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <text x="156" y="294" class="small">r = 0.18 m</text>
  </g>

  <g transform="translate(570 82)">
    <rect x="0" y="0" width="310" height="390" rx="8" class="panel"/>
    <text x="24" y="34" class="label">核心方程</text>
    <text x="24" y="76" class="small">左右轮速度 → 车体速度</text>
    <text x="24" y="112" class="formula">v     = (v_r + v_l) / 2</text>
    <text x="24" y="144" class="formula">omega = (v_r - v_l) / L</text>

    <line x1="24" y1="176" x2="286" y2="176" stroke="#cbd5e1"/>

    <text x="24" y="214" class="small">车体速度 → 左右轮速度</text>
    <text x="24" y="250" class="formula">v_l = v - omega * L / 2</text>
    <text x="24" y="282" class="formula">v_r = v + omega * L / 2</text>
    <text x="24" y="324" class="formula">omega_l = v_l / r</text>
    <text x="24" y="356" class="formula">omega_r = v_r / r</text>
  </g>
</svg>
